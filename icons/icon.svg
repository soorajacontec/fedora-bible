    <radialGradient id="fbB" cx=".3" cy=".18" r="1"><stop offset="0" stop-color="#1a3a6e"/><stop offset=".55" stop-color="#0b1428"/><stop offset="1" stop-color="#05080f"/></radialGradient>
    <filter id="fbGlow" filterUnits="userSpaceOnUse" x="0" y="0" width="512" height="512"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
