<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fedora Bible</title>
<meta name="description" content="Offline Fedora Linux command reference with options, flags and live terminal examples.">
<meta name="theme-color" content="#070b16" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#eef3fb" media="(prefers-color-scheme: light)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fedora Bible">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ═══════════ TOKENS ═══════════ */
:root{
  --bg:#070b16; --bg2:#0b1222; --panel:rgba(18,28,50,.72); --panel-solid:#101a30; --panel2:#15223d;
  --line:rgba(120,160,230,.16); --line2:rgba(120,170,255,.34);
  --text:#dfe8f7; --dim:#8a9bba; --bright:#f4f8ff;
  --accent:#4da3ff; --accent2:#2ee6d0; --accent3:#a78bfa;
  --warn:#f5b041; --danger:#ff6b6b; --ok:#3ddc97;
  --term:#050912; --term-text:#cfe3ff;
  --glow:0 0 0 1px rgba(77,163,255,.25),0 8px 32px rgba(10,40,100,.35);
  --shadow:0 6px 28px rgba(0,0,0,.45);
  --hdr:rgba(7,11,22,.78);
  --grid:rgba(77,163,255,.05);
  --tk-cmd:#5fb4ff; --tk-flag:#2ee6d0; --tk-str:#a5e3a0; --tk-path:#ffcf70; --tk-var:#d5a6ff; --tk-op:#ff8fb1; --tk-com:#5d7195;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:'Space Grotesk',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  --r:14px;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#eef3fb; --bg2:#e4ecf8; --panel:rgba(255,255,255,.82); --panel-solid:#fff; --panel2:#f3f7fd;
  --line:rgba(30,70,140,.13); --line2:rgba(30,90,200,.3);
  --text:#1b2842; --dim:#5a6b8a; --bright:#0b1428;
  --accent:#1f6fe0; --accent2:#0a9f8f; --accent3:#6d4fd8;
  --warn:#b8740a; --danger:#d23b3b; --ok:#16935f;
  --term:#0b1222; --term-text:#cfe3ff;
  --glow:0 0 0 1px rgba(31,111,224,.18),0 8px 26px rgba(30,70,140,.12);
  --shadow:0 4px 20px rgba(30,60,120,.1);
  --hdr:rgba(238,243,251,.82);
  --grid:rgba(31,111,224,.05);
  --tk-cmd:#1f6fe0; --tk-flag:#08857a; --tk-str:#2f7d2a; --tk-path:#a15c00; --tk-var:#7a3fd1; --tk-op:#c2185b; --tk-com:#7b8aa6;
  color-scheme:light;
}
/* inside terminals always dark tokens */
.term,.codebox{--tk-cmd:#5fb4ff;--tk-flag:#2ee6d0;--tk-str:#a5e3a0;--tk-path:#ffcf70;--tk-var:#d5a6ff;--tk-op:#ff8fb1;--tk-com:#5d7195}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;scroll-padding-top:150px}
body{font-family:var(--sans);background:var(--bg);color:var(--text);min-height:100dvh;overflow-x:hidden;
  background-image:
    radial-gradient(900px 500px at 85% -10%,rgba(77,163,255,.16),transparent 60%),
    radial-gradient(700px 500px at -10% 30%,rgba(46,230,208,.08),transparent 60%),
    linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:auto,auto,32px 32px,32px 32px;background-attachment:fixed}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
code,kbd{font-family:var(--mono);font-size:.84em;background:rgba(77,163,255,.14);color:var(--accent);padding:1px 6px;border-radius:5px;white-space:nowrap}
kbd{border:1px solid var(--line2);background:var(--panel2);color:var(--text)}
b{color:var(--bright)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ═══════════ HEADER ═══════════ */
.hdr{position:sticky;top:0;z-index:50;background:var(--hdr);backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);border-bottom:1px solid var(--line);padding-top:var(--sat)}
.hdr-row{display:flex;align-items:center;gap:10px;padding:10px 14px 6px;max-width:960px;margin:0 auto}
.logo{width:36px;height:36px;flex-shrink:0;filter:drop-shadow(0 0 10px rgba(77,163,255,.45))}
.brand{flex:1;min-width:0}
.brand h1{font-size:1.12rem;font-weight:700;letter-spacing:.5px;color:var(--bright);line-height:1.05;display:flex;align-items:center;gap:8px}
.brand small{display:block;font-family:var(--mono);font-size:.62rem;letter-spacing:1.4px;text-transform:uppercase;color:var(--accent2);margin-top:2px}
.ver{font-family:var(--mono);font-size:.6rem;font-weight:700;padding:2px 7px;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent3));color:#fff}
.ibtn{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;border:1px solid var(--line);background:var(--panel);transition:.2s;position:relative;flex-shrink:0}
.ibtn:hover{border-color:var(--accent);color:var(--accent)}
.ibtn svg{width:18px;height:18px}
.ibtn.on{border-color:var(--accent2);color:var(--accent2);box-shadow:0 0 16px rgba(46,230,208,.3)}
#installBtn{display:none}
#installBtn.show{display:grid}
/* equaliser */
.eq{display:flex;gap:2px;align-items:flex-end;height:14px}
.eq i{width:3px;background:currentColor;border-radius:2px;height:5px}.eq i:nth-child(2){height:11px}.eq i:nth-child(3){height:7px}.eq i:nth-child(4){height:13px}
.ibtn.on .eq i{animation:eq 1s ease-in-out infinite}
.ibtn.on .eq i:nth-child(2){animation-delay:.2s}.ibtn.on .eq i:nth-child(3){animation-delay:.4s}.ibtn.on .eq i:nth-child(4){animation-delay:.1s}
@keyframes eq{0%,100%{height:4px}50%{height:14px}}

.search{display:flex;gap:8px;padding:4px 14px 10px;max-width:960px;margin:0 auto;position:relative}
.search input{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line2);border-radius:12px;padding:10px 38px 10px 38px;color:var(--bright);font:500 .9rem var(--mono);outline:none;transition:.2s}
.search input::placeholder{color:var(--dim)}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(77,163,255,.18)}
.search .sicon{position:absolute;left:26px;top:50%;transform:translateY(-60%);width:16px;height:16px;color:var(--dim);pointer-events:none}
.search .clear{position:absolute;right:22px;top:50%;transform:translateY(-60%);width:28px;height:28px;border-radius:8px;color:var(--dim);display:none}
.search .clear.show{display:grid;place-items:center}
.search kbd{position:absolute;right:26px;top:50%;transform:translateY(-60%);font-size:.65rem;pointer-events:none}
.search .clear.show~kbd{display:none}

.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding:0 10px;max-width:960px;margin:0 auto;scroll-snap-type:x proximity}
.tabs::-webkit-scrollbar{display:none}
.tab{flex-shrink:0;padding:9px 12px 10px;font-size:.8rem;font-weight:600;color:var(--dim);border-bottom:2px solid transparent;white-space:nowrap;scroll-snap-align:start;transition:.2s}
.tab:hover{color:var(--text)}
.tab.active{color:var(--accent);border-color:var(--accent);text-shadow:0 0 14px rgba(77,163,255,.5)}

/* ═══════════ MAIN ═══════════ */
main{max-width:960px;margin:0 auto;padding:16px 14px calc(90px + var(--sab))}
.view{display:none;animation:rise .28s ease}
.view.active{display:block}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.sec-head{margin:4px 0 14px}
.sec-head h2{font-size:1.55rem;font-weight:700;color:var(--bright);display:flex;align-items:center;gap:10px;letter-spacing:.3px}
.sec-head h2::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--line2),transparent)}
.sec-head p{font-family:var(--mono);font-size:.75rem;color:var(--dim);margin-top:4px}
.sec-head p::before{content:'# ';color:var(--accent2)}
.sec-tools{display:flex;gap:8px;margin-bottom:12px}
.chip{font:600 .7rem var(--mono);padding:6px 10px;border-radius:99px;border:1px solid var(--line);background:var(--panel);color:var(--dim);transition:.2s}
.chip:hover{color:var(--accent);border-color:var(--accent)}

/* HERO */
.hero{position:relative;border-radius:18px;padding:22px 18px;margin-bottom:16px;overflow:hidden;background:linear-gradient(135deg,rgba(31,90,200,.35),rgba(20,30,60,.2) 60%,rgba(46,230,208,.12));border:1px solid var(--line2);box-shadow:var(--glow)}
:root[data-theme="light"] .hero{background:linear-gradient(135deg,rgba(31,111,224,.14),rgba(255,255,255,.7) 60%,rgba(10,159,143,.1))}
.hero::before{content:'';position:absolute;inset:-40%;background:conic-gradient(from 0deg,transparent,rgba(77,163,255,.14),transparent 30%);animation:spin 14s linear infinite;pointer-events:none}
@keyframes spin{to{transform:rotate(360deg)}}
.hero>*{position:relative}
.hero h2{font-size:1.6rem;line-height:1.15;color:var(--bright);margin-bottom:6px}
.hero h2 span{background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{font-size:.88rem;color:var(--dim);line-height:1.55;max-width:560px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px;max-width:520px}
.stat{background:rgba(0,0,0,.22);border:1px solid var(--line);border-radius:10px;padding:7px 9px;min-width:0}
:root[data-theme="light"] .stat{background:rgba(255,255,255,.7)}
.stat b{display:block;font:700 1.05rem var(--mono);color:var(--accent)}
.stat span{font-size:.56rem;white-space:nowrap;color:var(--dim);text-transform:uppercase;letter-spacing:.8px}
.hero-cta{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}.hero-cta .btn{flex:1 1 auto;justify-content:center}
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 14px;border-radius:10px;font-weight:600;font-size:.84rem;border:1px solid var(--line2);background:var(--panel);transition:.2s}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.pri{background:linear-gradient(90deg,var(--accent),#3b82f6);border-color:transparent;color:#fff;box-shadow:0 4px 18px rgba(77,163,255,.35)}
.btn.pri:hover{color:#fff;filter:brightness(1.1)}
.btn svg{width:15px;height:15px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{position:relative;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;transition:.22s;overflow:hidden}
.tile::after{content:'';position:absolute;inset:0;border-radius:inherit;padding:1px;background:linear-gradient(135deg,var(--accent),transparent 40%,var(--accent2));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:0;transition:.25s}
.tile:hover{transform:translateY(-2px);box-shadow:var(--glow)}
.tile:hover::after{opacity:1}
.tile .ti{font-size:1.5rem;margin-bottom:8px;display:block}
.tile b{display:block;font-size:.95rem;margin-bottom:2px}
.tile small{font:.66rem var(--mono);color:var(--dim)}
.tile .n{position:absolute;top:12px;right:12px;font:700 .62rem var(--mono);color:var(--accent2)}
.home-h{font:700 .72rem var(--mono);color:var(--accent2);letter-spacing:1.5px;text-transform:uppercase;margin:18px 0 10px}

/* ═══════════ CARDS ═══════════ */
.card{background:var(--panel);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:var(--r);margin-bottom:12px;box-shadow:var(--shadow);transition:border-color .2s,box-shadow .2s;overflow:hidden}
.card.open{border-color:var(--line2);box-shadow:var(--glow)}
.card-h{width:100%;display:flex;align-items:center;gap:10px;padding:13px 14px;text-align:left}
.card-h .ci{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--panel2);border:1px solid var(--line);font-size:1.05rem;flex-shrink:0}
.card-h .ct{flex:1;min-width:0}
.card-h .ct b{display:block;font-size:.98rem;font-weight:600}
.card-h .ct small{font:.66rem var(--mono);color:var(--dim)}
.badge{font:700 .58rem var(--mono);padding:3px 7px;border-radius:99px;letter-spacing:.5px;flex-shrink:0}
.b-blue{background:rgba(77,163,255,.15);color:var(--accent);border:1px solid rgba(77,163,255,.3)}
.b-green{background:rgba(61,220,151,.13);color:var(--ok);border:1px solid rgba(61,220,151,.3)}
.b-warn{background:rgba(245,176,65,.13);color:var(--warn);border:1px solid rgba(245,176,65,.3)}
.b-red{background:rgba(255,107,107,.13);color:var(--danger);border:1px solid rgba(255,107,107,.3)}
.chev{width:16px;height:16px;color:var(--dim);transition:transform .25s;flex-shrink:0}
.card.open .chev{transform:rotate(180deg);color:var(--accent)}
.card-b{display:none;padding:0 14px 14px}
.card.open .card-b{display:block;animation:rise .22s ease}
.desc{font-size:.86rem;color:var(--dim);line-height:1.6;margin-bottom:10px}

.seg{display:flex;gap:4px;padding:4px;background:var(--bg2);border:1px solid var(--line);border-radius:11px;margin-bottom:12px}
.seg button{flex:1;padding:8px 6px;border-radius:8px;font-size:.76rem;font-weight:600;color:var(--dim);display:flex;align-items:center;justify-content:center;gap:6px;transition:.2s;white-space:nowrap}
.seg button .cnt{font:700 .6rem var(--mono);opacity:.7}
.seg button.active{background:var(--panel-solid);color:var(--accent);box-shadow:0 1px 6px rgba(0,0,0,.25)}
.pane{display:none}.pane.active{display:block;animation:rise .2s ease}

/* commands list */
.cmds{border:1px solid var(--line);border-radius:11px;overflow:hidden;background:var(--bg2)}
.cmds-top{display:flex;justify-content:space-between;align-items:center;padding:7px 10px;border-bottom:1px solid var(--line);font:600 .62rem var(--mono);color:var(--dim);letter-spacing:1px;text-transform:uppercase}
.row{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border-bottom:1px solid var(--line);transition:background .15s}
.row:last-child{border-bottom:0}
.row:hover{background:rgba(77,163,255,.06)}
.row .l{flex:1;min-width:0}
.row pre{font:500 .8rem/1.55 var(--mono);white-space:pre-wrap;word-break:break-word;color:var(--text)}
.row .c{font-size:.74rem;color:var(--dim);margin-top:1px}
.row.hd{background:transparent;padding:10px 10px 4px}
.row.hd pre{color:var(--accent2);font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:1px}
.cp{flex-shrink:0;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--dim);border:1px solid transparent;transition:.2s}
.cp:hover{color:var(--accent);border-color:var(--line2)}
.cp svg{width:14px;height:14px}
.cp.ok{color:var(--ok)}
.mini{font:600 .62rem var(--mono);padding:4px 8px;border-radius:6px;border:1px solid var(--line);color:var(--dim);letter-spacing:.5px;transition:.2s}
.mini:hover{color:var(--accent);border-color:var(--accent)}
.mini.ok{color:var(--ok);border-color:var(--ok)}

.codebox{border:1px solid var(--line);border-radius:11px;background:var(--term);margin:10px 0;overflow:hidden}
.codebox .cmds-top{background:rgba(255,255,255,.03);border-color:rgba(255,255,255,.08);color:#7d8fb0}
.codebox pre{font:500 .78rem/1.65 var(--mono);color:var(--term-text);padding:12px;overflow-x:auto;white-space:pre}

/* tokens */
.t-cmd{color:var(--tk-cmd);font-weight:700}.t-flag{color:var(--tk-flag)}.t-str{color:var(--tk-str)}
.t-path{color:var(--tk-path)}.t-var{color:var(--tk-var)}.t-op{color:var(--tk-op)}.t-com{color:var(--tk-com);font-style:italic}
.t-sec{color:var(--tk-var);font-weight:700}.t-key{color:var(--tk-cmd)}

/* flags table */
.ftable{width:100%;border-collapse:separate;border-spacing:0;border:1px solid var(--line);border-radius:11px;overflow:hidden;font-size:.8rem}
.ftable th{overflow-wrap:anywhere;background:var(--panel2);color:var(--accent);font:700 .62rem var(--mono);text-transform:uppercase;letter-spacing:1px;text-align:left;padding:8px 10px}
.ftable td{padding:8px 10px;border-top:1px solid var(--line);vertical-align:top;line-height:1.45}
.ftable td:first-child{font-family:var(--mono);color:var(--tk-flag);font-size:.76rem;font-weight:600;white-space:nowrap}
.ftable td:last-child{color:var(--dim)}
.ftable tr:hover td{background:rgba(77,163,255,.05)}
.ftable.ref td:first-child{color:var(--accent)}
.ftable.mono td:last-child{font-family:var(--mono);font-size:.76rem;color:var(--ok);word-break:break-word}
.tblwrap{overflow-x:auto;margin:10px 0;-webkit-overflow-scrolling:touch}
@media (max-width:520px){.ftable td:first-child{white-space:normal;word-break:break-word;min-width:96px}.ftable td,.ftable th{padding:7px 8px}}

/* callouts */
.note{border-radius:0 10px 10px 0;padding:9px 12px;margin:10px 0;font-size:.82rem;line-height:1.55}
.note.tip{background:rgba(46,230,208,.08);border-left:3px solid var(--accent2)}
.note.warn{background:rgba(245,176,65,.08);border-left:3px solid var(--warn)}
.note.danger{background:rgba(255,107,107,.08);border-left:3px solid var(--danger)}
.note .nt{font:700 .62rem var(--mono);letter-spacing:1px;text-transform:uppercase;margin-right:6px}
.note.tip .nt{color:var(--accent2)}.note.warn .nt{color:var(--warn)}.note.danger .nt{color:var(--danger)}

/* ═══════════ TERMINAL ═══════════ */
.term{background:var(--term);border:1px solid rgba(120,170,255,.22);border-radius:12px;overflow:hidden;position:relative;box-shadow:inset 0 0 40px rgba(77,163,255,.06),0 6px 24px rgba(0,0,0,.35)}
.term::after{content:'';position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.018) 0 1px,transparent 1px 3px);mix-blend-mode:overlay}
.term-bar{display:flex;align-items:center;gap:6px;padding:8px 10px;background:rgba(255,255,255,.04);border-bottom:1px solid rgba(255,255,255,.07)}
.term-bar i{width:10px;height:10px;border-radius:50%;background:#ff5f57}
.term-bar i:nth-child(2){background:#febc2e}.term-bar i:nth-child(3){background:#28c840}
.term-bar span{flex:1;text-align:center;font:.66rem var(--mono);color:#7d8fb0;margin-right:30px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.term-body{padding:12px;font:500 .76rem/1.6 var(--mono);color:var(--term-text);min-height:92px;max-height:380px;overflow:auto;white-space:pre;-webkit-overflow-scrolling:touch}
.term-body .ps{color:#3ddc97;font-weight:700}.term-body .ps2{color:#5fb4ff;font-weight:700}
.term-body .o{color:#a9bbd8}
.term-body .err{color:#ff7b7b}
.term-body .dimo{color:#6b7fa3}
.cursor{display:inline-block;width:.55em;height:1.05em;background:#2ee6d0;vertical-align:-2px;animation:blink 1s steps(1) infinite;box-shadow:0 0 8px #2ee6d0}
@keyframes blink{50%{opacity:0}}
.term-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.term-actions .btn{padding:7px 12px;font-size:.78rem}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok);display:inline-block}
.sim{font:.64rem var(--mono);color:var(--dim);margin-top:8px}

/* playground */
.pg .term-body{min-height:52dvh;max-height:none;height:52dvh}
.pg-input{display:flex;align-items:center;gap:8px;border-top:1px solid rgba(255,255,255,.08);padding:10px 12px;background:rgba(255,255,255,.02)}
.pg-input label{font:700 .78rem var(--mono);color:#3ddc97;white-space:nowrap}
.pg-input input{flex:1;min-width:0;background:transparent;border:0;outline:none;color:#e9f2ff;font:500 .86rem var(--mono);caret-color:#2ee6d0}
.pg-input button{color:#5fb4ff;width:32px;height:32px;border-radius:8px;display:grid;place-items:center}
.pg-input button svg{width:17px;height:17px}
.sugs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:10px 0}
.sugs::-webkit-scrollbar{display:none}
.sugs .chip{white-space:nowrap;flex-shrink:0}

/* terminal: runnable section commands */
.term-body .ok{color:#3ddc97;font-weight:700}
.term-body .pgl{font:inherit;color:inherit;background:none;border:0;padding:0;text-align:left;cursor:pointer;white-space:pre;border-bottom:1px dashed rgba(95,180,255,.35)}
.term-body .pgl:hover,.term-body .pgl:focus-visible{background:rgba(95,180,255,.12);outline:none}
.pg-browse{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
.pg-bh{display:flex;align-items:center;gap:8px;font-size:.92rem;color:var(--bright)}
.pg-secs{padding:8px 0}
.pg-secs .chip.on{color:var(--accent);border-color:var(--accent);box-shadow:var(--glow)}
.pg-find input{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 12px;color:var(--text);font:500 .8rem var(--mono);outline:none}
.pg-find input:focus{border-color:var(--accent)}
#pgList{margin-top:10px}
.pg-cnt{font:.7rem var(--mono);color:var(--dim);margin:2px 2px 8px}
.pg-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;overflow:hidden}
.pg-card summary{display:flex;align-items:center;gap:8px;padding:10px 12px;cursor:pointer;list-style:none;font-size:.86rem;color:var(--bright)}
.pg-card summary::-webkit-details-marker{display:none}
.pg-card summary b{flex:1;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pg-card summary::after{content:'▸';color:var(--dim);transition:.2s}
.pg-card[open] summary::after{transform:rotate(90deg)}
.pgc{display:block;width:100%;text-align:left;padding:8px 12px;border-top:1px solid var(--line);background:none;min-width:0}
.pg-card .pgc:first-of-type{border-top-color:var(--line)}
#pgList>.pgc{border:1px solid var(--line);border-radius:10px;margin-bottom:6px;background:var(--panel)}
.pgc code{display:block;font:500 .76rem/1.45 var(--mono);background:none;padding:0;white-space:pre-wrap;word-break:break-word;color:var(--text)}
.pgc small{display:block;font-size:.72rem;color:var(--dim);margin-top:2px}
.pgc:hover,.pgc:focus-visible{background:rgba(95,180,255,.07)}
.pgc:active{background:rgba(95,180,255,.14)}

/* about / creator sheet */
.brand h1{white-space:nowrap}
@media (max-width:420px){.hdr-row{gap:8px}.hdr-row .ibtn{width:35px;height:35px;border-radius:10px}.brand h1{font-size:1.04rem;gap:6px}.brand small{font-size:.56rem;letter-spacing:1px}}
@media (max-width:350px){.brand .ver{display:none}}
.ab-hero{display:flex;align-items:center;gap:14px;padding:4px 0 14px}
.ab-hero svg{width:64px;height:64px;flex-shrink:0;filter:drop-shadow(0 0 14px rgba(77,163,255,.45))}
.ab-hero b{display:block;font-size:1.15rem;color:var(--bright)}
.ab-hero small{display:block;font:.68rem var(--mono);letter-spacing:1.2px;text-transform:uppercase;color:var(--accent2);margin-top:3px}
.ab-card{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.ab-who{display:flex;align-items:center;gap:12px}
.ab-av{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font:800 .82rem var(--mono);letter-spacing:.5px;color:#05080f;background:linear-gradient(135deg,#4da3ff,#2ee6d0);box-shadow:0 0 16px rgba(46,230,208,.35);flex-shrink:0}
.ab-who b{display:block;color:var(--bright);font-size:1rem;letter-spacing:.5px}
.ab-who div span{font-size:.74rem;color:var(--dim)}
.ab-mail{display:flex;align-items:center;gap:8px;margin-top:12px;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel);min-width:0}
.ab-mail a{flex:1;min-width:0;font:600 .8rem var(--mono);color:var(--accent);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-decoration:none}
.ab-mail a:hover{text-decoration:underline}
.ab-mail .k{font-size:.66rem;color:var(--dim);text-transform:uppercase;letter-spacing:1px}
.ab-note p{font-size:.86rem;line-height:1.6;color:var(--text);margin:0 0 8px}
.ab-note ul{margin:6px 0 0;padding-left:18px;font-size:.82rem;line-height:1.65;color:var(--text)}
.ab-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.ab-stats div{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px 4px;text-align:center}
.ab-stats b{display:block;font:700 1.02rem var(--mono);color:var(--accent)}
.ab-stats span{font-size:.62rem;color:var(--dim);text-transform:uppercase;letter-spacing:.8px}
.ab-fine{font:.66rem/1.5 var(--mono);color:var(--dim);margin:4px 2px 0}

/* search results */
.res{display:block;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:9px;transition:.2s}
.res:hover{border-color:var(--accent);box-shadow:var(--glow)}
.res .rs{font:700 .6rem var(--mono);color:var(--accent2);letter-spacing:1px;text-transform:uppercase}
.res b{display:block;margin:3px 0;font-size:.93rem}
.res p{font:.74rem/1.5 var(--mono);color:var(--dim);overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
mark{background:rgba(77,163,255,.28);color:var(--bright);border-radius:3px;padding:0 1px}
.empty{text-align:center;padding:40px 16px;color:var(--dim);font:.85rem var(--mono)}

/* ═══════════ FLOATING ═══════════ */
.player{position:fixed;left:50%;bottom:calc(14px + var(--sab));transform:translate(-50%,140%);z-index:60;display:flex;align-items:center;gap:10px;padding:8px 12px 8px 10px;border-radius:99px;background:var(--hdr);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line2);box-shadow:var(--glow);transition:transform .35s cubic-bezier(.2,.9,.3,1.2);max-width:calc(100% - 28px)}
.player.show{transform:translate(-50%,0)}
.player .pbtn{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;flex-shrink:0}
.player .pbtn svg{width:14px;height:14px}
.player .pi{font:600 .7rem var(--mono);color:var(--text);white-space:nowrap}
.player .pi small{display:block;font-size:.58rem;color:var(--dim);font-weight:500}
.player input[type=range]{width:90px;accent-color:var(--accent2)}
.player .x{width:26px;height:26px;border-radius:50%;color:var(--dim);display:grid;place-items:center}
.viz{display:flex;gap:2px;align-items:center;height:22px;width:34px}
.viz i{flex:1;background:linear-gradient(var(--accent2),var(--accent));border-radius:2px;height:3px;transition:height .08s}

.fab{position:fixed;right:16px;bottom:calc(76px + var(--sab));z-index:55;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--panel-solid);border:1px solid var(--line2);box-shadow:var(--shadow);color:var(--accent);opacity:0;pointer-events:none;transform:translateY(10px);transition:.25s}
.fab.show{opacity:1;pointer-events:auto;transform:none}
.fab svg{width:18px;height:18px}

.toast{position:fixed;left:50%;top:calc(16px + var(--sat));transform:translate(-50%,-300%);z-index:90;background:var(--panel-solid);border:1px solid var(--line2);color:var(--text);padding:9px 16px;border-radius:99px;font:600 .78rem var(--mono);box-shadow:var(--glow);transition:transform .3s;white-space:nowrap}
.toast.show{transform:translate(-50%,0)}
.net{display:none;font:700 .56rem var(--mono);color:var(--warn);border:1px solid var(--warn);border-radius:99px;padding:1px 6px;letter-spacing:.5px}
body.offline .net{display:inline-block}

footer .credit{display:inline-block;font:700 .74rem var(--mono);letter-spacing:1px;margin-bottom:4px;color:var(--dim)}footer .credit b{background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
footer{text-align:center;font:.66rem var(--mono);color:var(--dim);padding:24px 0 0;line-height:1.8}

/* ═══════════ COMMAND POP-UP ═══════════ */
.row[data-cmd]{cursor:pointer;position:relative}
.row[data-cmd]:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:6px}
.row[data-cmd]:active{background:rgba(77,163,255,.12)}
.tap-hint{font-style:normal;text-transform:none;letter-spacing:0;color:var(--accent2);font-weight:500}
.sheet-bg{position:fixed;inset:0;z-index:80;background:rgba(3,7,16,.55);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);opacity:0;transition:opacity .2s;display:flex;align-items:flex-end;justify-content:center}
.sheet-bg[hidden]{display:none}
.sheet-bg.open{opacity:1}
.sheet{width:100%;max-height:88dvh;display:flex;flex-direction:column;background:var(--panel-solid);border:1px solid var(--line2);border-bottom:0;border-radius:20px 20px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.45);transform:translateY(100%);transition:transform .25s cubic-bezier(.2,.9,.3,1);padding-bottom:var(--sab)}
.sheet-bg.open .sheet{transform:none}
.sh-grab{width:42px;height:4px;border-radius:4px;background:var(--line2);margin:8px auto 2px;flex-shrink:0}
#shBody{overflow-y:auto;overscroll-behavior:contain;padding:4px 16px 16px;-webkit-overflow-scrolling:touch}
body.sheet-on{overflow:hidden}
.sh-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:6px 0 12px;border-bottom:1px solid var(--line);position:sticky;top:-4px;background:var(--panel-solid);z-index:1}
.sh-name{font:800 1.05rem var(--mono);color:var(--tk-cmd);background:rgba(77,163,255,.1);border:1px solid var(--line2);border-radius:9px;padding:3px 10px}
.sh-sum{flex:1;min-width:140px;font-size:.86rem;color:var(--text);font-weight:600}
.sh-x{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);color:var(--dim);font-size:.9rem;flex-shrink:0;margin-left:auto}
.sh-x:hover{color:var(--accent);border-color:var(--accent)}
.sh-lbl{font:700 .62rem var(--mono);color:var(--accent2);letter-spacing:1px;text-transform:uppercase;margin:14px 0 6px;display:flex;align-items:center;gap:6px}
.sh-lbl b{color:var(--tk-cmd);text-transform:none;letter-spacing:0}
.sh-n{font-weight:700;color:var(--dim);background:var(--bg2);border-radius:6px;padding:0 5px}
.sh-sel .sh-line{background:var(--term);border-color:rgba(120,170,255,.25)}
.sh-sel .sh-line pre{color:var(--term-text)}
.sh-line{display:flex;align-items:flex-start;gap:8px;border:1px solid var(--line);border-radius:10px;padding:7px 8px 7px 11px;margin-bottom:6px;background:var(--bg2)}
.sh-line pre,.sh-line .l pre{flex:1;min-width:0;font:500 .8rem/1.55 var(--mono);white-space:pre-wrap;word-break:break-word;color:var(--text);padding-top:4px}
.sh-line .l{flex:1;min-width:0}
.sh-line .l>span{display:block;font-size:.74rem;color:var(--dim);margin-top:2px}
.sh-line .l a{color:var(--accent);text-decoration:none;font-weight:600}
.sh-desc{font-size:.8rem;color:var(--dim);margin:2px 2px 0}
.sh-bd{display:flex;gap:10px;align-items:baseline;padding:6px 10px;border-left:3px solid var(--accent2);background:rgba(46,230,208,.07);border-radius:0 8px 8px 0;margin-bottom:5px;font-size:.8rem}
.sh-bd code{font:700 .78rem var(--mono);color:var(--tk-flag);flex-shrink:0;max-width:45%;overflow-wrap:anywhere;white-space:normal;background:none;padding:0;border:0}
.sh-bd span{color:var(--text)}
.sh-opts{border:1px solid var(--line);border-radius:11px;overflow:hidden}
.sh-opt{display:grid;grid-template-columns:minmax(84px,38%) 1fr 30px;gap:8px;align-items:center;padding:6px 6px 6px 10px;border-top:1px solid var(--line);font-size:.8rem}
.sh-opt:first-child{border-top:0}
.sh-opt code{font:600 .76rem var(--mono);color:var(--tk-flag);overflow-wrap:anywhere;white-space:normal;background:none;padding:0;border:0;justify-self:start}
.sh-opt span{color:var(--dim);line-height:1.4}
.sh-opt.hit{background:rgba(46,230,208,.08)}
.sh-opt.hit span{color:var(--text)}
.sh-opt em{font:700 .56rem var(--mono);font-style:normal;color:var(--accent2);border:1px solid var(--accent2);border-radius:5px;padding:0 4px;margin-left:4px;text-transform:uppercase;letter-spacing:.5px;vertical-align:1px}
.sh-opt .cp{width:28px;height:28px}
.sh-foot{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap;position:sticky;bottom:-16px;background:var(--panel-solid);padding:10px 0 4px;border-top:1px solid var(--line)}
.sh-foot .btn{flex:1;justify-content:center;padding:9px 12px;font-size:.8rem}
@media (min-width:720px){
  .sheet-bg{align-items:center}
  .sheet{max-width:680px;border-radius:18px;border-bottom:1px solid var(--line2);max-height:84vh;transform:translateY(24px) scale(.98);opacity:0;transition:transform .22s,opacity .22s}
  .sheet-bg.open .sheet{transform:none;opacity:1}
  .sh-grab{display:none}
}

@media (min-width:720px){
  .hdr-row{padding-top:14px}
  .hero{padding:28px 26px}.hero h2{font-size:2rem}
  .row{align-items:center}
  .row .l{display:flex;gap:14px;align-items:baseline}
  .row pre{flex:0 1 auto}
  .row .c{margin:0 0 0 auto;text-align:right;flex-shrink:0;max-width:40%}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header class="hdr">
  <div class="hdr-row">
    <svg class="logo" viewBox="0 0 512 512" aria-hidden="true"><defs><linearGradient id="hfbG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4da3ff"/><stop offset="1" stop-color="#2ee6d0"/></linearGradient><linearGradient id="hfbP" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#14305a"/><stop offset="1" stop-color="#0a1830"/></linearGradient><linearGradient id="hfbR" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b48cff"/><stop offset="1" stop-color="#7b5cff"/></linearGradient><radialGradient id="hfbB" cx=".3" cy=".18" r="1"><stop offset="0" stop-color="#1a3a6e"/><stop offset=".55" stop-color="#0b1428"/><stop offset="1" stop-color="#05080f"/></radialGradient><filter id="hfbGlow" filterUnits="userSpaceOnUse" x="0" y="0" width="512" height="512"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="512" height="512" rx="112" fill="url(#hfbB)"/><rect x="20" y="20" width="472" height="472" rx="96" fill="none" stroke="url(#hfbG)" stroke-width="6" opacity=".45"/><path d="M74 160V392C148 378 214 388 256 416C298 388 364 378 438 392V160" fill="none" stroke="url(#hfbG)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" opacity=".7"/><path d="M256 168C212 138 152 128 96 138V370C152 362 212 370 256 396Z" fill="url(#hfbP)" stroke="url(#hfbG)" stroke-width="12" stroke-linejoin="round"/><path d="M256 168C300 138 360 128 416 138V370C360 362 300 370 256 396Z" fill="url(#hfbP)" stroke="url(#hfbG)" stroke-width="12" stroke-linejoin="round"/><path d="M362 132V214L340 198L318 214V136" fill="url(#hfbR)"/><g filter="url(#hfbGlow)"><path d="M136 222L184 262L136 302" fill="none" stroke="url(#hfbG)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/></g><rect x="288" y="238" width="96" height="12" rx="6" fill="#4da3ff" opacity=".45"/><rect x="288" y="266" width="70" height="12" rx="6" fill="#4da3ff" opacity=".35"/><rect x="288" y="306" width="62" height="26" rx="8" fill="#2ee6d0" filter="url(#hfbGlow)"/></svg>
    <div class="brand">
      <h1>Fedora Bible <span class="ver">F44</span> <span class="net">OFFLINE</span></h1>
      <small>Linux command reference</small>
    </div>
    <button class="ibtn" id="installBtn" title="Install app" aria-label="Install app">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3v12m0 0l-5-5m5 5l5-5M5 21h14"/></svg>
    </button>
    <button class="ibtn" id="aboutBtn" title="About &amp; creator" aria-label="About Fedora Bible and its creator">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
    </button>
    <button class="ibtn" id="musicBtn" title="Background music" aria-label="Toggle background music" aria-pressed="false">
      <span class="eq"><i></i><i></i><i></i><i></i></span>
    </button>
    <button class="ibtn" id="themeBtn" title="Toggle theme" aria-label="Toggle light/dark theme">
      <svg id="themeIco" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"></svg>
    </button>
  </div>
  <div class="search">
    <svg class="sicon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
    <label for="q" class="sr">Search</label>
    <input id="q" type="search" placeholder="Search commands, flags, topics…" autocomplete="off" spellcheck="false" enterkeyhint="search">
    <button class="clear" id="qClear" aria-label="Clear search"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <kbd>/</kbd>
  </div>
  <nav class="tabs" id="tabs" aria-label="Sections"></nav>
</header>

<main id="main">
  <section class="view" id="v-search" aria-live="polite"></section>
  <section class="view" id="v-home"></section>
  <section class="view" id="v-term"></section>
</main>

<div class="player" id="player" role="region" aria-label="Music player">
  <button class="pbtn" id="pToggle" aria-label="Play or pause"></button>
  <div class="viz" id="viz"><i></i><i></i><i></i><i></i><i></i><i></i></div>
  <div class="pi">Neon Kernel<small>ambient · generated live</small></div>
  <input type="range" id="vol" min="0" max="100" value="35" aria-label="Volume">
  <button class="x" id="pClose" aria-label="Hide player"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
</div>

<button class="fab" id="fab" aria-label="Back to top"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 19V5m0 0l-6 6m6-6l6 6"/></svg></button>
<div class="sheet-bg" id="cmdSheet" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="shTitle">
    <div class="sh-grab" aria-hidden="true"></div>
    <div id="shBody"></div>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>

<script src="data.js"></script>
<script src="cmdref.js"></script>
<script src="app.js"></script>
</body>
</html>
